name: Docker Image

on:
  push:
    branches: [main]
  schedule:
    # Runs "every Monday" (see https://crontab.guru)
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Log in to DockerHub Registry
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Get latest tailscale version
        run: |
          TAILSCALE_VERSION=$(curl -s https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r '.tag_name')
          echo "Latest tailscale version: $TAILSCALE_VERSION"
          echo "TAILSCALE_VERSION=$TAILSCALE_VERSION" >> "$GITHUB_ENV"

      - name: Check if the image exists
        run: |
          IMAGE_EXISTS=$(if docker manifest inspect ghcr.io/${{ github.repository_owner }}/derper:${{ env.TAILSCALE_VERSION }} > /dev/null; then echo "true"; else echo "false"; fi)
          echo "Image exists: $IMAGE_EXISTS"
          echo "IMAGE_EXISTS=$IMAGE_EXISTS" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build and push
        if: ${{ env.IMAGE_EXISTS == 'false' || github.event_name != 'schedule' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/derper:${{ env.TAILSCALE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/derper:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/derper:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/derper:${{ env.TAILSCALE_VERSION }}
            ghcr.io/${{ github.repository_owner }}/derper:latest
          build-args: |
            DERP_VERSION=${{ env.TAILSCALE_VERSION }}
